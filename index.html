const $=id=>document.getElementById(id);
let cur=0,score=[0,0,0,0],shown=[],fin=0;
$("logo").src=LOGO;
function main(){const m=DATA.main;$("brand").textContent=m.brand;$("title").textContent=m.title;$("subtitle").textContent=m.subtitle;$("startTitle").textContent=m.startTitle;$("startText").textContent=m.startText;$("startButton").textContent=m.buttonText}
function start(){cur=0;score=[0,0,0,0];$("start").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){const item=DATA.questions[cur];shown=item[1].slice();$("qno").textContent="QUESTION "+(cur+1)+" / "+DATA.questions.length;$("q").textContent=item[0];$("bar").style.width=((cur+1)/DATA.questions.length*100)+"%";const box=$("choices");box.innerHTML="";shown.forEach((o,i)=>{const b=document.createElement("button");b.type="button";b.className="choice";const n=document.createElement("b");n.textContent=String.fromCharCode(65+i);const t=document.createElement("span");t.textContent=o[1];b.append(n,t);b.addEventListener("click",()=>answer(i));box.appendChild(b)})}
function answer(i){score[shown[i][0]]++;cur++;if(cur<DATA.questions.length)render();else result()}
function result(){const max=Math.max(...score);fin=score.indexOf(max);const r=DATA.results[fin];$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("mascot").src=MASCOTS[fin];$("ri").textContent=r[0];$("rt").textContent=r[1];$("rg").textContent=r[2];$("rx").textContent=r[3];window.scrollTo(0,0)}
function restart(){$("result").classList.add("hidden");$("start").classList.remove("hidden");window.scrollTo(0,0)}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
async function save(){
 const r=DATA.results[fin],c=document.createElement("canvas"),x=c.getContext("2d");c.width=1080;c.height=1350;
 x.fillStyle="#063a61";x.fillRect(0,0,1080,1350);x.fillStyle="#fff";x.fillRect(80,80,920,1190);
 try{
  const lg=await loadImage(LOGO);x.drawImage(lg,465,1090,150,150);
  const im=await loadImage(MASCOTS[fin]);
  const boxX=150,boxY=330,boxW=780,boxH=390,ratio=Math.min(boxW/im.width,boxH/im.height);
  const w=im.width*ratio,h=im.height*ratio;x.drawImage(im,boxX+(boxW-w)/2,boxY+(boxH-h)/2,w,h);
 }catch(e){}
 x.textAlign="center";x.fillStyle="#075d83";x.font="bold 34px sans-serif";x.fillText(DATA.main.brand,540,190);
 x.font="bold 32px sans-serif";x.fillText(DATA.main.title,540,235);
 x.font="bold 54px sans-serif";x.fillText(r[1],540,820);
 x.fillStyle="#123047";x.font="30px sans-serif";x.fillText(r[2],540,875);

 // 유형 설명을 결과 카드 폭에 맞춰 자동 줄바꿈
 x.font="25px sans-serif";x.fillStyle="#36505f";
 function wrapText(ctx,text,cx,y,maxWidth,lineHeight){
   const words=text.split(" ");let line="",lines=[];
   for(let i=0;i<words.length;i++){
     const test=line?line+" "+words[i]:words[i];
     if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=words[i];}
     else line=test;
   }
   if(line) lines.push(line);
   lines.forEach((ln,idx)=>ctx.fillText(ln,cx,y+idx*lineHeight));
 }
 wrapText(x,r[3],540,940,690,42);
 const a=document.createElement("a");a.download="나의기부유형_"+r[1]+".png";a.href=c.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();
}
$("startButton").addEventListener("click",start);$("restartButton").addEventListener("click",restart);$("saveButton").addEventListener("click",save);main();
})();
